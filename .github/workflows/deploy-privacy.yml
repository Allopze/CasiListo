name: Deploy privacy site

on:
  push:
    branches: [main]
    paths: [privacy-site/**, .github/workflows/deploy-privacy.yml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://casilisto.lat' }}
      PUBLIC_SUPPORT_EMAIL: ${{ vars.PUBLIC_SUPPORT_EMAIL }}
      PUBLIC_POLICY_EFFECTIVE_DATE: ${{ vars.PUBLIC_POLICY_EFFECTIVE_DATE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build privacy and support pages
        working-directory: privacy-site
        run: npm run build
      - name: Validate generated site
        working-directory: privacy-site
        run: npm test
      # El sitio es un Worker de solo assets, no un proyecto Pages: con
      # `pages deploy` la API responde "Project not found" porque busca en otra
      # lista. La configuración vive en privacy-site/wrangler.jsonc.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: privacy-site
          # La acción instala wrangler 3.90.0 por defecto, anterior al soporte
          # de `assets` en la configuración: con esa versión el deploy subiría
          # un Worker vacío.
          wranglerVersion: '4.133.0'
          command: deploy
