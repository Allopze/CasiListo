name: Release to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (CURRENT_PROJECT_VERSION). Vacío = usa el número de ejecución del workflow.'
        required: false
        type: string

jobs:
  archive-export-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # 26.2 y no 26.0: la imagen macos-26-arm64 (20260907) trae Xcode
          # 26.0.1 pero solo runtimes de simulador iOS 26.2/26.4/26.5, y en
          # Xcode 26 actool exige un runtime del mismo SDK para compilar el
          # AppIcon aunque el destino sea dispositivo. Con 26.0 el archive de
          # release murió con «No simulator runtime version from [...]
          # available to use with iphonesimulator SDK version 23A339».
          # 26.2 es el Xcode mínimo cuyo SDK (23C54) tiene runtime instalado.
          xcode-version: '26.2'
      - name: Validate Xcode, secrets and version
        shell: bash
        run: |
          set -euo pipefail
          major="$(xcodebuild -version | awk '/Xcode/{split($2, v, "."); print v[1]}')"
          test "$major" -ge 26

          # Los secretos se validan ANTES del archive: fallar después de 40
          # minutos de compilación por una variable vacía no tiene sentido.
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"

          settings="$(xcodebuild -showBuildSettings -project CasiListo.xcodeproj -scheme CasiListo -configuration Release)"
          marketing="$(printf '%s\n' "$settings" | awk -F' = ' '/MARKETING_VERSION/{print $2; exit}')"
          test -n "$marketing"

          # CURRENT_PROJECT_VERSION está fijo en 1 en el pbxproj y nadie lo
          # subía: App Store Connect rechaza un build repetido. Se deriva del
          # número de ejecución del workflow (monótono) salvo override manual.
          build="${{ inputs.build_number }}"
          if [ -z "$build" ]; then build="${{ github.run_number }}"; fi
          [[ "$build" =~ ^[0-9]+$ ]]
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "Publicando $marketing ($build)"

          bash ci/validate-privacy-manifests.sh artifacts
      - name: Prepare App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          # La key se escribe ANTES del archive: `-allowProvisioningUpdates`
          # necesita autenticarse contra ASC para emitir el perfil de
          # distribución, no solo el paso de upload.
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$key_dir/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Archive Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild archive \
            -project CasiListo.xcodeproj \
            -scheme CasiListo \
            -configuration Release \
            -archivePath artifacts/CasiListo.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tee artifacts/xcodebuild-archive.log
      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath artifacts/CasiListo.xcarchive \
            -exportPath artifacts/export \
            -exportOptionsPlist ci/ExportOptions-AppStore.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee artifacts/xcodebuild-export.log
      - name: Upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          # Xcode 26 ya no trae iTMSTransporter («iTMSTransporter is now
          # part of Transporter. Please install Transporter from the Mac App
          # Store»), así que la subida del build 5 murió aunque el IPA estaba
          # listo. Se sube con el propio exportArchive (destination=upload),
          # que reutiliza la API key. manageAppVersionAndBuildNumber=false
          # para que Xcode no reescriba el BUILD_NUMBER que fija este job.
          xcodebuild -exportArchive \
            -archivePath artifacts/CasiListo.xcarchive \
            -exportPath artifacts/upload \
            -exportOptionsPlist ci/ExportOptions-AppStoreUpload.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee artifacts/xcodebuild-upload.log
      - name: Remove App Store Connect key
        if: always()
        shell: bash
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casilisto-release-artifacts
          path: artifacts
          if-no-files-found: warn
