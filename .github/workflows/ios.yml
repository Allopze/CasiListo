name: iOS verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # 26.2 y no 26.0: la imagen macos-26-arm64 (20260907) trae Xcode
          # 26.0.1 pero solo runtimes de simulador iOS 26.2/26.4/26.5, y en
          # Xcode 26 actool exige un runtime del mismo SDK para compilar el
          # AppIcon aunque el destino sea dispositivo. Con 26.0 el archive de
          # release murió con «No simulator runtime version from [...]
          # available to use with iphonesimulator SDK version 23A339».
          # 26.2 es el Xcode mínimo cuyo SDK (23C54) tiene runtime instalado.
          xcode-version: '26.2'
      - name: Require Xcode 26 or newer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk '/Xcode/{split($2, v, "."); print v[1]}')"
          test "$major" -ge 26
      - name: Lint with SwiftLint
        shell: bash
        env:
          # Fijada a propósito: los umbrales de .swiftlint.yml están
          # calibrados contra las reglas de esta versión. Con la que traiga el
          # runner, una regla nueva por defecto pondría en rojo un PR que no
          # tiene nada que ver. Subirla es un cambio deliberado: recalibrar
          # primero en local con `swiftlint lint --config .swiftlint.yml`.
          SWIFTLINT_VERSION: '0.65.1'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
          /tmp/swiftlint/swiftlint version
          # Falla solo por violaciones de severidad "error": el código
          # existente pasa en warning, nunca en rojo. Un PR que introduce algo
          # claramente descuidado sí tumba este paso.
          /tmp/swiftlint/swiftlint lint --config .swiftlint.yml --reporter github-actions-logging \
            CasiListo CasiListoShared CasiListoWidget CasiListoTests CasiListoUITests
      - name: Build and run unit/UI tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          # Los tres arneses visuales no verifican nada en CI y se saltan para
          # que el gate del PR mida lo que importa:
          #  - ScreenshotCaptureTests adjunta 23 PNG al `.xcresult` para revisión
          #    visual local y espera en más de 20 sleep() bloqueantes.
          #  - FullLengthScreenshotTests renderiza con ImageRenderer para
          #    inspección humana.
          #  - VideoTourTests son 301 líneas de Thread.sleep con una sola
          #    aserción: existe para que `ci/record-app-tour.sh` lo envuelva en
          #    `simctl recordVideo`. Sin esa envoltura no graba nada y en el
          #    runner costaba ~3,5 min de reloj por PR.
          xcodebuild test \
            -project CasiListo.xcodeproj \
            -scheme CasiListo \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -skip-testing:CasiListoUITests/ScreenshotCaptureTests \
            -skip-testing:CasiListoUITests/VideoTourTests \
            -skip-testing:CasiListoTests/FullLengthScreenshotTests \
            -resultBundlePath artifacts/CasiListoTests.xcresult | tee artifacts/xcodebuild-test.log
      - name: Validate privacy manifests
        if: always()
        run: bash ci/validate-privacy-manifests.sh artifacts
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-verification-artifacts
          path: artifacts
          if-no-files-found: warn
